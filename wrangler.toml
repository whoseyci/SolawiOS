# Cloudflare Pages configuration for SolawiOS.
#
# Deployment options:
#  1. Dashboard: connect the GitHub repo at https://dash.cloudflare.com → Pages,
#     build command `npm run build`, build output directory `dist`.
#  2. CLI: install wrangler (`npm i -g wrangler`), then `wrangler pages deploy dist`.
#
# The `name`, `compatibility_date`, and `pages_build_output_dir` below are only
# consulted by the CLI; the dashboard will use the values entered in the UI.
name = "solawios"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./dist"
