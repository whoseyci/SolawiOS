# Cloudflare Pages configuration for SolawiOS (static site)
#
# Recommended setup (Git-connected Pages project):
#   Build command:        npm run build
#   Build output directory: dist
#
# For CLI deploys:
#   npx wrangler pages deploy dist --project-name=solawios
#
# This wrangler.toml enables `wrangler pages deploy` and modern asset uploads.

name = "solawios"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
# Optional: customize cache headers if needed
# [assets.headers]
# "/*" = { "Cache-Control" = "public, max-age=31536000, immutable" }
