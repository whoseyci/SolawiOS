# Optional: deploy from GitHub Actions.
#
# NOTE: if you connect the repo in the Cloudflare dashboard (Workers Builds),
# Cloudflare builds and deploys on every push by itself and you do NOT need this
# workflow. It is here for teams that prefer Actions, or want a deploy gate.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit, D1:Edit
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'content/**']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY_VIA_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }

      - run: npm ci
      - run: npm run build
      - run: npm run test

      # Regenerate and apply the schema BEFORE the new code goes live, so a
      # deploy that adds a table cannot hit a database that lacks it.
      - name: Generate schema
        run: npm run schema

      - name: Apply D1 schema
        working-directory: packages/server-cf
        run: npx wrangler d1 execute solawi-os --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: packages/server-cf
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
