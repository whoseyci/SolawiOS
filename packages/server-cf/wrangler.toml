# Cloudflare deployment (ADR-0004).
#
# Multi-tenant by default: one D1 database holds many farms, every table carries
# org_id, and every query filters on it. For farms that want hard isolation, the
# same schema runs in a per-farm D1 database — no code changes required.

# Muss zum Repository-/Projektnamen passen, sonst überschreibt Workers Builds
# den Namen und warnt bei jedem Deploy.
name = "solawios"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ---------------------------------------------------------- static assets
# The PWA is served by the SAME Worker as the API: one deploy, one origin,
# no CORS. `run_worker_first` keeps /api/* on the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

# ---------------------------------------------------------------- D1 (SQLite)
# Create with:  wrangler d1 create solawi-os
# Then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "solawi-os"
database_id = "83563c34-b6e6-4d7b-af8a-42c36a90ea74"

# ------------------------------------------------------------- R2 (blobs)
# Fotos, Dokumente, Exporte.
#
# STANDARDMÄSSIG AUS: R2 verlangt eine hinterlegte Zahlungsmethode, selbst im
# kostenlosen Kontingent. Ohne dieses Binding läuft alles außer Dateiupload —
# die Plattformschicht liefert dann einen No-op-Blobstore (platform-cf/index.ts).
#
# Zum Aktivieren:
#   1. npx wrangler r2 bucket create solawi-os-blobs
#   2. die drei Zeilen unten einkommentieren
#
# [[r2_buckets]]
# binding = "BLOBS"
# bucket_name = "solawi-os-blobs"

# ------------------------------------------------------------------ KV (cache)
# Create with:  wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "5010e793274c4206ba6258b7006de7ab"

# ------------------------------------------------- Durable Objects (bidding)
# One instance per Bieterrunde: owns WebSocket fan-out and the batching rules.
[[durable_objects.bindings]]
name = "BIDDING"
class_name = "BiddingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BiddingRoom"]

# ------------------------------------------------------------------- Queues
# Optional. Uncomment after: wrangler queues create solawi-jobs
# [[queues.producers]]
# binding = "JOBS"
# queue = "solawi-jobs"
#
# [[queues.consumers]]
# queue = "solawi-jobs"

# ------------------------------------------------------------------- Cron
[triggers]
crons = ["0 6 * * *"]

[vars]
MIGRATE_ON_BOOT = "true"
