function finBudget(root, year) {
  const cats = ['Saatgut', 'Pflanzgut', 'Dünger', 'Werkzeug', 'Personal', 'Verteilung', 'Pacht', 'Versicherung', 'Sonstiges'];
  const expenses = state.payments.filter(p => p.kind === 'ausgabe' && p.date && new Date(p.date).getFullYear() === year);
  root.innerHTML = `
    <div class="card card-pad mb-3">
      <div class="card-title mb-3">Jahresbudget ${year}</div>
      <div class="row gap-2 mb-3">
        <button class="btn btn-sm btn-primary" id="fb-fill">Mit Erfahrungswerten füllen</button>
        <button class="btn btn-sm" id="fb-save">Budget speichern</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Kategorie</th><th class="text-right">Budget</th><th class="text-right">Bisher ausgegeben</th><th class="text-right">Differenz</th><th>Fortschritt</th></tr></thead>
          <tbody id="fb-rows"></tbody>
          <tfoot><tr><td><b>Summe</b></td><td class="table-num" id="fb-sum-budget"></td><td class="table-num" id="fb-sum-spent"></td><td class="table-num" id="fb-sum-diff"></td><td></td></tr></tfoot>
        </table>
      </div>
    </div>
  `;
  function render() {
    state.budget = state.budget || {};
    const rows = $('#fb-rows', root);
    rows.innerHTML = '';
    let sumB = 0, sumS = 0;
    cats.forEach((c, i) => {
      const budget = state.budget[c] || 0;
      const spent = expenses.filter(p => p.category === c).reduce((s,p) => s + p.amount, 0);
      const diff = budget - spent;
      const pct = budget ? spent / budget * 100 : 0;
      sumB += budget; sumS += spent;
      const tr = h(`<tr>
        <td><b>${c}</b></td>
        <td class="text-right"><input type="number" step="50" data-cat="${c}" class="text-right" style="width:120px" value="${budget}"/></td>
        <td class="text-mono text-right">${fmtMoney(spent)}</td>
        <td class="text-mono text-right" style="color:${diff<0?'var(--danger)':'var(--primary)'}">${fmtMoney(diff)}</td>
        <td><div class="progress" style="width:100px"><div class="progress-bar ${pct>90?'danger':'warn'}" style="width:${Math.min(100,pct)}%"></div></div></td>
      </tr>`);
      rows.appendChild(tr);
    });
    rows.querySelectorAll('input').forEach(inp => {
      inp.oninput = () => {
        state.budget[inp.dataset.cat] = Number(inp.value) || 0;
        render();
      };
    });
    $('#fb-sum-budget', root).textContent = fmtMoney(sumB);
    $('#fb-sum-spent', root).textContent = fmtMoney(sumS);
    $('#fb-sum-diff', root).textContent = fmtMoney(sumB - sumS);
  }
  $('#fb-fill', root).onclick = () => {
    state.budget = { Saatgut: 1200, Pflanzgut: 600, Dünger: 400, Werkzeug: 350, Personal: 8000, Verteilung: 1200, Pacht: 2400, Versicherung: 1100, Sonstiges: 600 };
    Store.save(state);
    render();
  };
  $('#fb-save', root).onclick = () => { Store.save(state); toast('Budget gespeichert', 'success'); };
  render();
}

  render();
};

window.chargeAllMembers = async function() {
  if (await confirmDialog({ message:`Beiträge für ${monthName(TODAY)} für alle aktiven Mitglieder buchen?`, okText:'Alle buchen' })) {
    const shares = state.shares.filter(s => s.active);
    const month = new Date().toISOString().slice(0, 7);
    let added = 0;
    for (const s of shares) {
      const m = state.members.find(x => x.id === s.member);
      if (!m) continue;
      const exists = state.payments.find(p => p.kind === 'beitrag' && p.member === m.id && p.date && p.date.slice(0,7) === month);
      if (exists) continue;
      state.payments.push({
        id: uid('p'),
        date: new Date().toISOString(),
        kind: 'beitrag',
        name: `Mitgliederbeitrag ${monthName(TODAY)}`,
        category: 'Mitgliederbeitrag',
        amount: s.monthlyPrice,
        member: m.id,
        method: 'lastschrift'
      });
      added++;
    }
    Store.save(state);
    toast(`${added} Beiträge gebucht`, 'success');
    render();
  }
};

window.exportFinanceCSV = function() {
  const rows = [['Datum','Art','Name','Kategorie','Mitglied','Betrag','Zahlungsweg']];
  state.payments.forEach(p => {
    const m = state.members.find(x => x.id === p.member);
    rows.push([p.date, p.kind, p.name, p.category, m?.name||'', p.amount, p.method]);
  });
  download('finanzen.csv', rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n'), 'text/csv');
};

function saveMessage(m2, status) {
  const title = $('#msg-title', m2.body).value.trim();
  const audience = $('#msg-audience', m2.body).value;
  const depot = $('#msg-depot', m2.body).value || null;
  const body = $('#msg-body', m2.body).value;
  if (!title || !body) { toast('Betreff und Nachricht erforderlich', 'error'); return; }
  let recipients = 0;
  if (audience === 'all') recipients = state.members.length;
  else if (audience === 'active') recipients = state.members.filter(m => m.status === 'aktiv').length;
  else if (audience === 'warteliste') recipients = state.members.filter(m => m.status === 'warteliste').length;
  else if (audience === 'depot') recipients = state.members.filter(m => m.depot === depot).length;
  state.messages.push({
    id: uid('msg'),
    title, audience, depot, body,
    status,
    recipients,
    createdAt: new Date().toISOString(),
    date: status === 'sent' ? new Date().toISOString() : null
  });
  Store.save(state);
  m2.close();
  toast(status === 'sent' ? `An ${recipients} Mitglieder gesendet` : 'Als Entwurf gespeichert', 'success');
  render();
}

window.importJSON = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      Object.assign(state, data);
      Store.save(state);
      toast('Import erfolgreich', 'success');
      render();
    } catch (err) { toast('Fehler beim Import', 'error'); }
  };
  reader.readAsText(file);
};

/* ============================================================
   CHARTS — minimal canvas chart library
   ============================================================ */
function drawHarvestChart(id, days) {
  const canvas = $('#'+id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentNode.clientWidth, H = canvas.height || 200;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  const start = addDays(TODAY, -days);
  const data = [];
  for (let i = 0; i < days; i++) {
    const d = addDays(start, i);
    const same = d.toDateString();
    const v = state.harvest.filter(h => h.date && new Date(h.date).toDateString() === same).reduce((s,h)=>s+h.amount,0);
    data.push({ date: d, value: v });
  }
  const max = Math.max(...data.map(d => d.value), 1);
  const pad = { l: 30, r: 8, t: 8, b: 18 };
  const w = W - pad.l - pad.r, h = H - pad.t - pad.b;
  // Grid
  ctx.strokeStyle = getCssVar('--line') || '#e3ddc9'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (h/4)*i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    ctx.fillStyle = getCssVar('--ink-muted') || '#888'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(max - (max/4)*i).toString(), pad.l - 4, y+3);
  }
  // Bars
  const bw = w / data.length;
  data.forEach((d, i) => {
    const bh = d.value / max * h;
    const x = pad.l + i*bw;
    const y = pad.t + h - bh;
    if (d.value > 0) {
      ctx.fillStyle = d.date > TODAY ? getCssVar('--line-strong') : '#4a7c3a';
      ctx.fillRect(x + 0.5, y, Math.max(1, bw - 1), bh);
    }
  });
  // Today line
  const todayIdx = data.findIndex(d => d.date.toDateString() === TODAY.toDateString());
  if (todayIdx >= 0) {
    const x = pad.l + todayIdx * bw + bw/2;
    ctx.strokeStyle = getCssVar('--accent') || '#c97a3a'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t+h); ctx.stroke();
    ctx.setLineDash([]);
  }
  // X labels
  ctx.fillStyle = getCssVar('--ink-muted') || '#888'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  for (let i = 0; i < 6; i++) {
    const idx = Math.floor(i / 5 * (data.length-1));
    const d = data[idx].date;
    const x = pad.l + idx*bw + bw/2;
    ctx.fillText(`${d.getDate()}.${d.getMonth()+1}.`, x, H - 4);
  }
}

function drawDonut(id, data) {
  const canvas = $('#'+id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentNode.clientWidth, H = canvas.height || 220;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const cx = W/2 - 60, cy = H/2, r = Math.min(W, H)/2 - 20, ir = r * 0.55;
  let a0 = -Math.PI/2;
  data.forEach(d => {
    const a1 = a0 + (d.value/total) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    a0 = a1;
  });
  // Inner hole
  ctx.fillStyle = getCssVar('--bg-card') || '#fff';
  ctx.beginPath(); ctx.arc(cx, cy, ir, 0, Math.PI*2); ctx.fill();
  // Total
  ctx.fillStyle = getCssVar('--ink') || '#000'; ctx.font = 'bold 18px serif'; ctx.textAlign = 'center';
  ctx.fillText(total.toLocaleString('de-DE'), cx, cy-2);
  ctx.font = '10px sans-serif'; ctx.fillStyle = getCssVar('--ink-soft') || '#666';
  ctx.fillText('Gesamt', cx, cy+12);
  // Legend
  ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
  let lx = W - 130, ly = 16;
  data.forEach(d => {
    ctx.fillStyle = d.color; ctx.fillRect(lx, ly-8, 10, 10);
    ctx.fillStyle = getCssVar('--ink') || '#000';
    ctx.fillText(`${d.label}: ${d.value}`, lx + 14, ly);
    ly += 18;
  });
}

function drawBarChart(id, data, k1, k2) {
  const canvas = $('#'+id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentNode.clientWidth, H = canvas.height || 320;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
  const max = Math.max(...data.map(d => Math.max(d[k1]||0, d[k2]||0)), 1);
  const pad = { l: 50, r: 8, t: 16, b: 32 };
  const w = W - pad.l - pad.r, h = H - pad.t - pad.b;
  // Grid
  ctx.strokeStyle = getCssVar('--line') || '#e3ddc9'; ctx.lineWidth = 1;
  ctx.fillStyle = getCssVar('--ink-muted') || '#888'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (h/4)*i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    ctx.fillText(Math.round(max - (max/4)*i).toString(), pad.l - 4, y+3);
  }
  // Bars
  const bw = w / data.length;
  data.forEach((d, i) => {
    const x = pad.l + i*bw + 2;
    const bw1 = (bw - 6) / 2;
    if (d[k1]) {
      const bh1 = (d[k1]/max) * h;
      ctx.fillStyle = '#4a7c3a';
      ctx.fillRect(x, pad.t + h - bh1, bw1, bh1);
    }
    if (d[k2]) {
      const bh2 = (d[k2]/max) * h;
      ctx.fillStyle = '#a83a2a';
      ctx.fillRect(x + bw1 + 2, pad.t + h - bh2, bw1, bh2);
    }
  });
  // X labels
  ctx.fillStyle = getCssVar('--ink-muted') || '#888'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  data.forEach((d, i) => {
    const x = pad.l + i*bw + bw/2;
    ctx.fillText(d.label, x, H - 14);
  });
  // Legend
  ctx.fillStyle = '#4a7c3a'; ctx.fillRect(W - 160, 8, 10, 10);
  ctx.fillStyle = getCssVar('--ink') || '#000'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Einnahmen', W - 146, 16);
  ctx.fillStyle = '#a83a2a'; ctx.fillRect(W - 80, 8, 10, 10);
  ctx.fillText('Ausgaben', W - 66, 16);
}

function drawBar(id, data, color) {
  const canvas = $('#'+id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentNode.clientWidth, H = canvas.height || 220;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
  const max = Math.max(...data.map(d => d.value), 1);
  const pad = { l: 30, r: 8, t: 8, b: 28 };
  const w = W - pad.l - pad.r, h = H - pad.t - pad.b;
  ctx.strokeStyle = getCssVar('--line') || '#e3ddc9';
  ctx.fillStyle = getCssVar('--ink-muted') || '#888'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (h/4)*i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    ctx.fillText(Math.round(max - (max/4)*i).toString(), pad.l - 4, y+3);
  }
  const bw = w / data.length;
  data.forEach((d, i) => {
    const bh = (d.value/max) * h;
    const x = pad.l + i*bw + 2;
    const y = pad.t + h - bh;
    if (d.value > 0) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, Math.max(1, bw - 4), bh);
    }
  });
  ctx.fillStyle = getCssVar('--ink-muted') || '#888'; ctx.textAlign = 'center';
  data.forEach((d, i) => {
    if (i % 2 === 0) {
      const x = pad.l + i*bw + bw/2;
      ctx.fillText(d.label, x, H - 14);
    }
  });
}

function getCssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function pickColor(s) {
  const colors = ['#4a7c3a','#3a6e8a','#c97a3a','#b8860b','#a83a2a','#8a3a6a','#6cae57','#5a9a4a'];
  let hash = 0; for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash<<5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

    }
  ];
  return s;
}

/* ============================================================
   Helpers
   ============================================================ */
function sameMonth(d1, d2) {
  const a = new Date(d1), b = new Date(d2);
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
}
function monthName(d) {
  return new Date(d).toLocaleDateString('de-DE', { month: 'long' });
}
function seasonMonths() {
  const start = new Date(state.meta.season, 2, 1);
  const end = new Date(state.meta.season, 11, 31);
  const weeks = [];
  let w = new Date(start);
  while (w < end) { weeks.push(new Date(w)); w.setDate(w.getDate() + 7); }
  return weeks;
}

window.openCommandPalette = function() {
  const actions = [
    { label: 'Neues Mitglied anlegen', icon: '👥', action: () => openMemberForm() },
    { label: 'Neue Ernte buchen', icon: '🌾', action: () => openHarvestForm() },
    { label: 'Neue Aufgabe', icon: '✅', action: () => openTaskForm() },
    { label: 'Buchung erfassen', icon: '💶', action: () => openPaymentForm() },
    { label: 'Mitteilung senden', icon: '✉️', action: () => openMessageForm() },
    { label: 'Neue Kultur anlegen', icon: '🌱', action: () => openCropForm() },
    { label: 'Neues Beet anlegen', icon: '🗺️', action: () => openBedForm() },
    { label: 'Neues Depot anlegen', icon: '📍', action: () => openDepotForm() },
    { label: 'Neuer Artikel', icon: '📦', action: () => openInventoryForm() },
    { label: 'Bepflanzung planen', icon: '🌱', action: () => openPlantingForm() },
    { label: 'Bestellung anlegen', icon: '🛒', action: () => openOrderForm() },
    { label: 'Dashboard', icon: '🏡', action: () => navigate('dashboard') },
    { label: 'Berichte', icon: '📊', action: () => navigate('reports') },
    { label: 'Backup erstellen', icon: '📦', action: () => exportJSON() },
  ];
  const body = h(`
    <div class="form-row"><input id="cmd-q" placeholder="Aktion suchen…" style="font-size:16px;padding:10px" autofocus/></div>
    <div id="cmd-list" style="max-height:50vh;overflow:auto"></div>
  `);
  function render(q='') {
    const list = $('#cmd-list', body);
    const ql = q.toLowerCase();
    const items = actions.filter(a => a.label.toLowerCase().includes(ql));
    list.innerHTML = items.map((a, i) => `<div class="activity-item" data-i="${i}" style="cursor:pointer;padding:10px;border-radius:6px">
      <div class="activity-icon">${a.icon}</div>
      <div class="activity-body"><div><b>${a.label}</b></div></div>
    </div>`).join('') || '<div class="text-soft text-sm" style="padding:12px">Keine Treffer</div>';
    list.querySelectorAll('[data-i]').forEach(el => {
      el.onmouseenter = () => { list.querySelectorAll('[data-i]').forEach(x => x.style.background=''); el.style.background='var(--bg-soft)'; };
      el.onclick = () => { items[Number(el.dataset.i)].action(); m.close(); };
    });
  }
  render();
  const m = openModal({ title: 'Schnellaktion', body, footer: `<button class="btn" data-cancel>Schließen <span class="text-soft">Esc</span></button>` });
  m.footer.querySelector('[data-cancel]').onclick = () => m.close();
  setTimeout(() => $('#cmd-q', body).focus(), 50);
  $('#cmd-q', body).oninput = (e) => render(e.target.value);
  $('#cmd-q', body).onkeydown = (e) => {
    if (e.key === 'Enter') {
      const first = $('#cmd-list [data-i]', body);
      if (first) first.click();
    }
    if (e.key === 'Escape') m.close();
  };
};

/* Global search */
let searchTimeout = null;
$('#global-search').oninput = (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value;
  searchTimeout = setTimeout(() => {
    if (q.length < 2) return;
    const results = searchAll(q);
    if (!results.length) return;
    const body = h(`<div>${results.slice(0, 12).map(r => `<div class="activity-item" style="cursor:pointer" onclick="navigate('${r.page}')">${r.label}</div>`).join('')}</div>`);
    const m = openModal({ title: `Suche: "${q}"`, body, footer: `<button class="btn" data-close>Schließen</button>` });
    m.footer.querySelector('[data-close]').onclick = () => m.close();
  }, 200);
};

function searchAll(q) {
  const ql = q.toLowerCase();
  const r = [];
  state.members.forEach(m => { if ((m.name+m.email+m.city).toLowerCase().includes(ql)) r.push({ label: `👥 ${m.name}${m.city?' · '+m.city:''}`, page: 'members' }); });
  state.crops.forEach(c => { if (c.name.toLowerCase().includes(ql)) r.push({ label: `🌱 ${c.name} · ${c.family||''}`, page: 'crops' }); });
  state.tasks.forEach(t => { if (t.title.toLowerCase().includes(ql)) r.push({ label: `✅ ${t.title}`, page: 'tasks' }); });
  state.inventory.forEach(i => { if (i.name.toLowerCase().includes(ql)) r.push({ label: `📦 ${i.name}`, page: 'inventory' }); });
  return r;
}

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCommandPalette(); }
  if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length-1].remove();
});

/* Re-render charts on resize */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (currentPage === 'dashboard') render(); }, 200);
});

/* INIT */
renderNav();
render();
</script>
