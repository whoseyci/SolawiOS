<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SolawiOS — Solidarisches landwirtschaftliches Betriebssystem</title>
<style>
  :root {
    --bg: #f5f1e8;
    --bg-card: #ffffff;
    --bg-soft: #faf6ee;
    --bg-sidebar: #2d3a2a;
    --bg-sidebar-hover: #3d4d39;
    --bg-sidebar-active: #4d6247;
    --ink: #1f2a1c;
    --ink-soft: #5a6657;
    --ink-muted: #8b9485;
    --line: #e3ddc9;
    --line-strong: #c8c0a5;
    --primary: #4a7c3a;
    --primary-dark: #355a28;
    --primary-soft: #dfeacf;
    --accent: #c97a3a;
    --accent-soft: #f7e3d0;
    --warn: #b8860b;
    --warn-soft: #faf0d3;
    --danger: #a83a2a;
    --danger-soft: #f5d6d0;
    --info: #3a6e8a;
    --info-soft: #d6e6f0;
    --leaf: #6cae57;
    --tomato: #d25a3a;
    --carrot: #e88c3a;
    --potato: #b89868;
    --berry: #8a3a6a;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.12);
    --radius: 8px;
    --radius-sm: 4px;
    --radius-lg: 12px;
    --mono: ui-monospace, 'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace;
    --serif: 'Iowan Old Style', 'Palatino Linotype', 'Palatino', 'Georgia', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1f17;
      --bg-card: #252b21;
      --bg-soft: #2d3329;
      --bg-sidebar: #14180f;
      --bg-sidebar-hover: #23291e;
      --bg-sidebar-active: #2e3826;
      --ink: #e8e4d6;
      --ink-soft: #b8b3a3;
      --ink-muted: #7a7567;
      --line: #3a4030;
      --line-strong: #555a45;
      --primary: #7ab85a;
      --primary-dark: #5a9340;
      --primary-soft: #2d3a26;
      --accent: #e89758;
      --accent-soft: #3a2a1a;
      --warn: #d4a032;
      --warn-soft: #3a2f1a;
      --danger: #d65a48;
      --danger-soft: #3a1f1a;
      --info: #5a93b5;
      --info-soft: #1a2a35;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea {
    font: inherit;
    color: inherit;
    background: var(--bg-card);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  textarea { resize: vertical; font-family: inherit; }
  a { color: var(--primary-dark); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }

  /* Layout */
  .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  .sidebar {
    background: var(--bg-sidebar);
    color: #e0dcc8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .brand {
    padding: 18px 18px 14px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
  }
  .brand-name { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: .02em; }
  .brand-sub { font-size: 11px; opacity: .65; margin-top: 2px; letter-spacing: .05em; text-transform: uppercase; }
  .nav { flex: 1; overflow-y: auto; padding: 10px 0; }
  .nav-group { margin-bottom: 14px; }
  .nav-group-title {
    padding: 6px 18px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .45;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    cursor: pointer;
    color: #d8d4c0;
    border-left: 3px solid transparent;
    user-select: none;
    transition: background .12s;
  }
  .nav-item:hover { background: var(--bg-sidebar-hover); }
  .nav-item.active {
    background: var(--bg-sidebar-active);
    border-left-color: var(--primary);
    color: #fff;
  }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-text { flex: 1; font-size: 13px; }
  .nav-badge {
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 600;
  }
  .user-block {
    border-top: 1px solid rgba(255,255,255,.08);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    font-size: 12px;
  }
  .user-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
  }
  .user-info { flex: 1; line-height: 1.3; }
  .user-name { font-weight: 500; }
  .user-role { opacity: .6; font-size: 11px; }

  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 56px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar-title { font-size: 18px; font-weight: 600; }
  .topbar-sub { color: var(--ink-soft); font-size: 12px; }
  .topbar-spacer { flex: 1; }
  .topbar-search {
    position: relative;
    width: 280px;
  }
  .topbar-search input { width: 100%; padding-left: 30px; }
  .topbar-search::before {
    content: '🔍';
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: .5;
  }
  .topbar-btn {
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    display: flex; align-items: center; gap: 6px;
    color: var(--ink-soft);
  }
  .topbar-btn:hover { background: var(--bg-soft); color: var(--ink); }

  .content { flex: 1; overflow: auto; padding: 24px; }

  /* Common components */
  .page { max-width: 1400px; margin: 0 auto; }
  .page-h {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0; }
  .page-desc { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong);
    background: var(--bg-card);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    transition: background .12s, border-color .12s, transform .05s;
  }
  .btn:hover { background: var(--bg-soft); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-accent:hover { background: #a86530; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-danger:hover { background: #8a2e22; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--bg-soft); color: var(--ink); }
  .btn-sm { padding: 4px 8px; font-size: 12px; }
  .btn-icon { padding: 6px 8px; }
  .btn-group { display: inline-flex; }
  .btn-group .btn { border-radius: 0; border-right-width: 0; }
  .btn-group .btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .btn-group .btn:last-child { border-right-width: 1px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .btn-group .btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card-pad { padding: 18px; }
  .card-h {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .card-title { font-size: 14px; font-weight: 600; }
  .card-body { padding: 18px; }

  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 1000px) {
    .grid-3, .grid-4, .grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; }
  }

  /* Stat cards */
  .stat {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .stat-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }
  .stat-value { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 4px 0; }
  .stat-trend { font-size: 11px; display: flex; align-items: center; gap: 4px; }
  .trend-up { color: var(--primary); }
  .trend-down { color: var(--danger); }
  .stat-icon {
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    background: var(--primary-soft);
    color: var(--primary-dark);
  }
  .stat.accent .stat-icon { background: var(--accent-soft); color: var(--accent); }
  .stat.warn .stat-icon { background: var(--warn-soft); color: var(--warn); }
  .stat.info .stat-icon { background: var(--info-soft); color: var(--info); }
  .stat.danger .stat-icon { background: var(--danger-soft); color: var(--danger); }

  /* Tables */
  .table { width: 100%; border-collapse: collapse; }
  .table th, .table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .table th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); font-weight: 600; background: var(--bg-soft); position: sticky; top: 0; }
  .table tbody tr { transition: background .1s; }
  .table tbody tr:hover { background: var(--bg-soft); cursor: pointer; }
  .table tbody tr.selected { background: var(--primary-soft); }
  .table-wrap { overflow: auto; max-height: 70vh; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg-card); }
  .table-empty { text-align: center; padding: 40px; color: var(--ink-muted); }
  .table-num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
  .badge-primary { background: var(--primary-soft); color: var(--primary-dark); }
  .badge-accent { background: var(--accent-soft); color: var(--accent); }
  .badge-warn { background: var(--warn-soft); color: var(--warn); }
  .badge-danger { background: var(--danger-soft); color: var(--danger); }
  .badge-info { background: var(--info-soft); color: var(--info); }
  .badge-neutral { background: var(--bg-soft); color: var(--ink-soft); border: 1px solid var(--line); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

  /* Forms */
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-row label { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
  .form-row .required { color: var(--danger); }
  .form-row input, .form-row select, .form-row textarea { width: 100%; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .form-help { font-size: 11px; color: var(--ink-muted); }
  .form-section { font-size: 12px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    animation: fadeIn .15s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    width: min(640px, 90vw);
    max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
    animation: slideUp .2s;
  }
  .modal.wide { width: min(900px, 95vw); }
  .modal.xwide { width: min(1100px, 95vw); }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-h {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-body { padding: 20px; overflow: auto; flex: 1; }
  .modal-f {
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: 8px;
    background: var(--bg-soft);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }

  /* Toast */
  .toast-tray { position: fixed; top: 70px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    min-width: 240px;
    max-width: 360px;
    font-size: 13px;
    animation: toastIn .25s;
  }
  .toast.success { background: var(--primary-dark); }
  .toast.error { background: var(--danger); }
  .toast.warn { background: var(--warn); }
  @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Calendar / Gantt */
  .cal { display: grid; grid-template-columns: 220px 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--bg-card); }
  .cal-h { background: var(--bg-soft); padding: 8px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--ink-soft); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .cal-row { display: contents; }
  .cal-label { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 500; }
  .cal-cell { padding: 4px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 36px; position: relative; }
  .cal-months { display: grid; grid-template-columns: repeat(12, 1fr); background: var(--bg-soft); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .cal-month { padding: 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-soft); border-left: 1px solid var(--line); }

  /* Gantt */
  .gantt-row { display: grid; grid-template-columns: 200px 1fr; border-bottom: 1px solid var(--line); min-height: 32px; }
  .gantt-label { padding: 6px 10px; font-size: 12px; border-right: 1px solid var(--line); background: var(--bg-soft); display: flex; align-items: center; }
  .gantt-track { position: relative; padding: 6px 0; }
  .gantt-bar {
    position: absolute;
    height: 20px;
    border-radius: 4px;
    padding: 0 6px;
    font-size: 11px;
    color: #fff;
    display: flex; align-items: center;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  .gantt-bar:hover { filter: brightness(1.1); }
  .gantt-grid { position: absolute; inset: 0; display: grid; pointer-events: none; }
  .gantt-grid > div { border-left: 1px dashed rgba(0,0,0,.08); }
  .gantt-months { display: grid; border-bottom: 1px solid var(--line); background: var(--bg-soft); position: sticky; top: 0; }
  .gantt-month { padding: 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-soft); border-left: 1px solid var(--line); }

  /* Kanban */
  .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; min-height: 400px; }
  .kanban-col { background: var(--bg-soft); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; }
  .kanban-col-h { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; font-size: 12px; font-weight: 600; }
  .kanban-col-h .count { background: var(--bg-card); color: var(--ink-soft); border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .kanban-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 8px; cursor: grab; box-shadow: var(--shadow); }
  .kanban-card:hover { box-shadow: var(--shadow-md); }
  .kanban-card-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .kanban-card-meta { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink-soft); }
  .kanban-card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab { padding: 8px 14px; cursor: pointer; color: var(--ink-soft); border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--primary-dark); border-bottom-color: var(--primary); }

  /* Progress */
  .progress { height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .progress-bar { height: 100%; background: var(--primary); transition: width .3s; }
  .progress-bar.warn { background: var(--warn); }
  .progress-bar.danger { background: var(--danger); }
  .progress-bar.accent { background: var(--accent); }

  /* Charts */
  .chart { width: 100%; height: 220px; }
  .chart-lg { height: 320px; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); }
  .filter-bar .topbar-search { width: 240px; }
  .filter-bar input, .filter-bar select { padding: 5px 8px; font-size: 12px; }

  /* Member detail */
  .detail-h {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .detail-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 600;
  }
  .detail-name { font-family: var(--serif); font-size: 22px; font-weight: 600; }
  .detail-meta { color: var(--ink-soft); font-size: 12px; }

  /* Field plan */
  .field-plan { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
  .field-beds { display: flex; flex-direction: column; gap: 4px; }
  .field-bed { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .field-bed:hover { background: var(--bg-soft); }
  .field-bed.active { background: var(--primary-soft); border-color: var(--primary); }
  .field-bed-color { width: 12px; height: 12px; border-radius: 3px; }
  .field-canvas { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); min-height: 400px; position: relative; overflow: hidden; }
  .field-bed-block { position: absolute; border-radius: 4px; padding: 4px; font-size: 10px; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.1; cursor: pointer; }

  /* Mobile */
  .mobile-toggle { display: none; }
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; inset: 0; z-index: 100; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle { display: inline-flex; }
    .topbar-search { display: none; }
    .kanban { grid-template-columns: 1fr 1fr; }
  }

  /* Misc */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state .icon { font-size: 48px; opacity: .4; margin-bottom: 12px; }
  .empty-state h3 { margin: 0 0 6px; font-weight: 500; }
  .empty-state p { margin: 0; font-size: 13px; }

  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .grow { flex: 1; }
  .text-soft { color: var(--ink-soft); }
  .text-muted { color: var(--ink-muted); }
  .text-mono { font-family: var(--mono); }
  .text-sm { font-size: 12px; }
  .text-xs { font-size: 11px; }
  .text-lg { font-size: 16px; }
  .text-right { text-align: right; }
  .text-center { text-align: center; }
  .mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
  .mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
  .gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; }
  .p-2 { padding: 8px; } .p-3 { padding: 12px; } .p-4 { padding: 16px; }
  .divider { height: 1px; background: var(--line); margin: 12px 0; }
  .hide { display: none !important; }

  /* Tag input */
  .tag-input { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px; background: var(--bg-card); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); }
  .tag-input input { border: none; outline: none; flex: 1; min-width: 60px; padding: 2px 4px; background: transparent; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--primary-soft); color: var(--primary-dark); border-radius: 99px; font-size: 11px; }
  .tag .x { cursor: pointer; opacity: .6; }
  .tag .x:hover { opacity: 1; }

  /* Member item */
  .member-row { display: grid; grid-template-columns: 1fr 1.2fr 1fr 1fr 100px 80px; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .member-row:hover { background: var(--bg-soft); }
  .member-row .avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .member-name { font-weight: 500; }
  .member-sub { font-size: 11px; color: var(--ink-soft); }

  /* Notification dot */
  .notif-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid var(--bg-card); }

  /* Toggle */
  .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--line-strong); border-radius: 20px; transition: .2s; }
  .toggle-slider::before { content: ''; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .toggle input:checked + .toggle-slider { background: var(--primary); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

  /* Activity feed */
  .activity { display: flex; flex-direction: column; }
  .activity-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .activity-item:last-child { border-bottom: none; }
  .activity-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .activity-body { flex: 1; font-size: 12px; }
  .activity-time { color: var(--ink-muted); font-size: 11px; }

  /* Hero cards (dashboard) */
  .hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    border-radius: var(--radius-lg);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '🌱';
    position: absolute;
    right: -20px; bottom: -40px;
    font-size: 200px;
    opacity: .1;
  }
  .hero h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 22px; font-weight: 500; }
  .hero p { margin: 0; opacity: .9; font-size: 13px; }

  /* Icon button */
  .icon-btn { background: transparent; border: 1px solid transparent; padding: 4px 6px; border-radius: var(--radius-sm); color: var(--ink-soft); }
  .icon-btn:hover { background: var(--bg-soft); color: var(--ink); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name">🌾 SolawiOS</div>
      <div class="brand-sub">Hof Wurzelreich · Saison 2026</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="user-block">
      <div class="user-avatar">AM</div>
      <div class="user-info">
        <div class="user-name">Anna Müller</div>
        <div class="user-role">Gärtnermeisterin</div>
      </div>
      <button class="icon-btn" title="Abmelden">⎋</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-ghost mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-sub" id="topbar-sub">Übersicht aller Bereiche</div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-search">
        <input type="text" placeholder="Suchen…" id="global-search" />
      </div>
      <button class="topbar-btn" title="Schnellaktion (Cmd+K)" onclick="openCommandPalette()">⌘ Aktion</button>
      <button class="topbar-btn" style="position:relative" title="Benachrichtigungen">🔔<span class="notif-dot"></span></button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast-tray" id="toast-tray"></div>
<script>
/* ============================================================
   SolawiOS — single file, no dependencies
   - persistent state in localStorage
   - module-style sections rendered into #content
   ============================================================ */
'use strict';

/* ---------- State ---------- */
const STORAGE_KEY = 'solawios_v1';
const SAMPLE_KEY  = 'solawios_seeded_v1';
const TODAY = new Date('2026-07-14T08:00:00');

const SEASON_START = new Date('2026-03-15');
const SEASON_END   = new Date('2026-12-15');

const CROP_PALETTE = {
  'Tomate':     '#d25a3a',
  'Paprika':    '#e88c3a',
  'Zucchini':   '#7ca84a',
  'Kürbis':     '#e07a30',
  'Salat':      '#6cae57',
  'Kohl':       '#8aaa6a',
  'Karotte':    '#e89030',
  'Rote Bete':  '#8a3a3a',
  'Zwiebel':    '#c8a878',
  'Knoblauch':  '#d8c8a8',
  'Spinat':     '#3a8a4a',
  'Erbsen':     '#8aaa3a',
  'Bohnen':     '#a87a3a',
  'Gurke':      '#5a9a4a',
  'Kräuter':    '#4a8a6a',
  'Beeren':     '#8a3a6a',
  'Kartoffel':  '#b89868',
  'Mais':       '#d8b840',
  'Mangold':    '#a83a4a',
  'Feldsalat':  '#4a7a3a',
  'Radieschen': '#c84a6a',
  'Pastinake':  '#e0d0a8',
  'Porree':     '#6a9a5a',
  'Blumen':     '#d870a0'
};

const SEED = {
  meta: {
    farm: { name: 'Hof Wurzelreich', since: 2017, hectares: 4.2, members_target: 85, founder: 'Familie Berger' },
    season: 2026,
    currency: 'EUR',
    sharePrice: { small: 78, medium: 112, large: 156 },
    shareUnit: '€/Monat'
  },
  members: [],
  shares: [],
  crops: [],
  beds: [],
  depots: [],
  products: [],
  pickups: [],
  budget: {},
  plantings: [],
  harvest: [],
  tasks: [],
  inventory: [],
  orders: [],
  payments: [],
  events: [],
  messages: [],
  notes: []
};

/* ---------- Persistence ---------- */
const Store = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  },
  save(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  },
  reset() { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(SAMPLE_KEY); }
};

/* ---------- Util ---------- */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const h  = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); if (t.content.childElementCount === 1) return t.content.firstChild; const wrap = document.createElement('div'); wrap.appendChild(t.content); return wrap; };
const uid = (() => { let i = 0; return (p='id') => `${p}_${Date.now().toString(36)}_${(i++).toString(36)}`; })();
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('de-DE', { year:'numeric', month:'short', day:'2-digit' }) : '—';
const fmtDateTime = (d) => d ? new Date(d).toLocaleString('de-DE', { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
const fmtMoney = (v) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(v||0);
const fmtNum = (v, d=1) => new Intl.NumberFormat('de-DE', { maximumFractionDigits: d, minimumFractionDigits: d }).format(v||0);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = (d) => { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0,0,0,0); return x; };
const isoWeek = (d) => { const x = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day); const yearStart = new Date(Date.UTC(x.getUTCFullYear(),0,1)); return { week: Math.ceil((((x - yearStart) / 86400000) + 1) / 7), year: x.getUTCFullYear() }; };
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const isPast = (d) => new Date(d) < TODAY;
const isFuture = (d) => new Date(d) > TODAY;

const escapeHTML = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, kind='') {
  const el = h(`<div class="toast ${kind}">${escapeHTML(msg)}</div>`);
  $('#toast-tray').appendChild(el);
  setTimeout(() => el.style.opacity = '0', 2400);
  setTimeout(() => el.remove(), 2700);
}

function openModal({ title, body, footer, wide, xwide, onClose }) {
  const back = h(`<div class="modal-backdrop"></div>`);
  const modal = h(`<div class="modal ${wide?'wide':''} ${xwide?'xwide':''}"></div>`);
  const mh = h(`<div class="modal-h"><div class="modal-title">${escapeHTML(title)}</div><button class="icon-btn" data-close>✕</button></div>`);
  const mb = h(`<div class="modal-body"></div>`);
  const mf = footer ? h(`<div class="modal-footer modal-f"></div>`) : null;
  if (typeof body === 'string') mb.innerHTML = body;
  else if (body) mb.appendChild(body);
  if (mf && typeof footer === 'string') mf.innerHTML = footer;
  else if (footer) mf.appendChild(footer);
  modal.append(mh, mb); if (mf) modal.append(mf);
  back.appendChild(modal);
  const close = () => { back.remove(); modalStack = modalStack.filter(m => m !== back); if (onClose) onClose(); };
  mh.querySelector('[data-close]').onclick = close;
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  modal.addEventListener('click', e => e.stopPropagation());
  document.body.appendChild(back);
  modalStack.push(back);
  return { back, modal, body: mb, footer: mf, close };
}

function confirmDialog({ title='Bestätigen', message='', okText='Bestätigen', okClass='btn-primary', cancelText='Abbrechen' } = {}) {
  return new Promise(resolve => {
    const m = openModal({
      title,
      body: `<p>${escapeHTML(message)}</p>`,
      footer: `<button class="btn" data-cancel>${escapeHTML(cancelText)}</button><button class="btn ${okClass}" data-ok>${escapeHTML(okText)}</button>`,
      onClose: () => resolve(false)
    });
    m.footer.querySelector('[data-ok]').onclick = () => { m.close(); resolve(true); };
    m.footer.querySelector('[data-cancel]').onclick = () => { m.close(); resolve(false); };
  });
}

/* ---------- App state ---------- */
let state = Store.load() || SEED;
if (!localStorage.getItem(SAMPLE_KEY)) {
  state = seedSample(state);
  Store.save(state);
  localStorage.setItem(SAMPLE_KEY, '1');
}

let currentPage = 'dashboard';
let currentTab = {};
let modalStack = [];

/* ---------- Nav config ---------- */
const NAV = [
  { group: 'Übersicht', items: [
    { id: 'dashboard',  label: 'Dashboard',  icon: '🏡' },
  ]},
  { group: 'Mitglieder & Ernteanteile', items: [
    { id: 'members',    label: 'Mitglieder',  icon: '👥', badge: () => state.members.length },
    { id: 'shares',     label: 'Ernteanteile', icon: '🥕' },
    { id: 'distribution', label: 'Verteilung', icon: '🚚' },
  ]},
  { group: 'Anbau', items: [
    { id: 'crops',      label: 'Kulturarten',  icon: '🌱' },
    { id: 'fieldplan',  label: 'Beetplanung',  icon: '🗺️' },
    { id: 'calendar',   label: 'Anbaukalender', icon: '📅' },
    { id: 'harvest',    label: 'Ernteerfassung', icon: '🌾' },
  ]},
  { group: 'Betrieb', items: [
    { id: 'tasks',      label: 'Aufgaben',     icon: '✅', badge: () => state.tasks.filter(t => t.status !== 'done').length },
    { id: 'inventory',  label: 'Lager & Saatgut', icon: '📦' },
    { id: 'orders',     label: 'Bestellungen',  icon: '🛒' },
  ]},
  { group: 'Finanzen & Kommunikation', items: [
    { id: 'finance',    label: 'Finanzen',     icon: '💶' },
    { id: 'messages',   label: 'Mitteilungen', icon: '✉️' },
    { id: 'reports',    label: 'Berichte',     icon: '📊' },
  ]},
  { group: 'Einstellungen', items: [
    { id: 'settings',   label: 'Stammdaten',   icon: '⚙️' },
  ]},
];

function renderNav() {
  const nav = $('#nav');
  nav.innerHTML = '';
  for (const g of NAV) {
    const wrap = h(`<div class="nav-group"><div class="nav-group-title">${escapeHTML(g.group)}</div></div>`);
    for (const it of g.items) {
      const badge = it.badge ? it.badge() : 0;
      const node = h(`<div class="nav-item ${currentPage===it.id?'active':''}" data-page="${it.id}">
        <span class="nav-icon">${it.icon}</span>
        <span class="nav-text">${escapeHTML(it.label)}</span>
        ${badge ? `<span class="nav-badge">${badge}</span>` : ''}
      </div>`);
      node.onclick = () => navigate(it.id);
      wrap.appendChild(node);
    }
    nav.appendChild(wrap);
  }
}

function navigate(page, tab) {
  currentPage = page;
  if (tab) currentTab[page] = tab;
  renderNav();
  render();
  window.scrollTo(0, 0);
  document.querySelector('.content').scrollTop = 0;
}

/* ---------- Render entry ---------- */
function render() {
  const page = NAV.flatMap(g => g.items).find(i => i.id === currentPage) || NAV[0].items[0];
  $('#topbar-title').textContent = page.label;
  $('#topbar-sub').textContent = PAGE_SUBTITLES[page.id] || '';
  const c = $('#content');
  c.innerHTML = '';
  const wrap = h('<div class="page"></div>');
  c.appendChild(wrap);
  const fn = PAGES[page.id];
  if (fn) fn(wrap); else wrap.innerHTML = '<div class="empty-state"><div class="icon">🚧</div><h3>Seite in Arbeit</h3></div>';
}

const PAGE_SUBTITLES = {
  dashboard: 'Übersicht aller Bereiche',
  members: 'Stammdaten, Anteile und Kontakte',
  shares: 'Verteilung der Ernteanteile',
  distribution: 'Depots, Routen und Abholungen',
  crops: 'Kulturarten, Sorten, Anbauinformationen',
  fieldplan: 'Beete und Feldaufteilung',
  calendar: 'Saat-, Pflanz- und Erntetermine',
  harvest: 'Erntemengen und Qualität',
  tasks: 'Anstehende Aufgaben und Einsätze',
  inventory: 'Saatgut, Werkzeug, Verbrauchsmaterial',
  orders: 'Zusatzbestellungen und Hofladen',
  finance: 'Einnahmen, Ausgaben, Beiträge',
  messages: 'Rundschreiben an Mitglieder',
  reports: 'Saisonberichte und Auswertungen',
  settings: 'Hof, Saison, Stammdaten'
};

/* ============================================================
   PAGES — each renders into a wrapper element
   ============================================================ */
const PAGES = {};

/* ---------- Dashboard ---------- */
PAGES.dashboard = function(root) {
  const seasonDay = daysBetween(SEASON_START, TODAY);
  const seasonTotal = daysBetween(SEASON_START, SEASON_END);
  const seasonPct = Math.min(100, Math.max(0, Math.round(seasonDay / seasonTotal * 100)));

  const activeMembers = state.members.filter(m => m.status === 'aktiv').length;
  const totalShares = state.shares.filter(s => s.active).reduce((sum, s) => sum + (s.type === 'small' ? 1 : s.type === 'medium' ? 2 : 3), 0);
  const monthRevenue = state.payments.filter(p => p.kind === 'beitrag' && p.date && sameMonth(p.date, TODAY)).reduce((s, p) => s + (p.amount||0), 0);
  const monthExpenses = state.payments.filter(p => p.kind === 'ausgabe' && p.date && sameMonth(p.date, TODAY)).reduce((s, p) => s + (p.amount||0), 0);
  const tasksOpen = state.tasks.filter(t => t.status !== 'done').length;
  const harvestWeek = state.harvest.filter(h => h.date && daysBetween(startOfWeek(TODAY), h.date) >= 0 && daysBetween(h.date, addDays(startOfWeek(TODAY), 6)) >= 0).reduce((s, h) => s + (h.amount||0), 0);

  root.innerHTML = `
    <div class="hero mb-4">
      <h2>Willkommen zurück, Anna</h2>
      <p>Saison-Tag ${seasonDay} von ${seasonTotal} · ${activeMembers} aktive Mitglieder · ${fmtNum(totalShares)} Ernteanteile · Wetter: sonnig 24°C</p>
    </div>

    <div class="grid grid-5 mb-4">
      <div class="stat">
        <div class="stat-icon">👥</div>
        <div class="stat-label">Mitglieder</div>
        <div class="stat-value">${activeMembers}</div>
        <div class="stat-trend trend-up">▲ 3 seit Vormonat</div>
      </div>
      <div class="stat accent">
        <div class="stat-icon">🥕</div>
        <div class="stat-label">Ernteanteile</div>
        <div class="stat-value">${fmtNum(totalShares)}</div>
        <div class="stat-trend text-soft">Ziel: ${state.meta.farm.members_target}</div>
      </div>
      <div class="stat info">
        <div class="stat-icon">💶</div>
        <div class="stat-label">Einnahmen ${monthName(TODAY)}</div>
        <div class="stat-value">${fmtMoney(monthRevenue)}</div>
        <div class="stat-trend text-soft">Ausgaben: ${fmtMoney(monthExpenses)}</div>
      </div>
      <div class="stat warn">
        <div class="stat-icon">🌾</div>
        <div class="stat-label">Ernte diese Woche</div>
        <div class="stat-value">${fmtNum(harvestWeek)} <span class="text-sm text-muted">kg</span></div>
        <div class="stat-trend text-soft">Saison: ${fmtNum(state.harvest.reduce((s,h)=>s+(h.amount||0),0))} kg</div>
      </div>
      <div class="stat">
        <div class="stat-icon">✅</div>
        <div class="stat-label">Offene Aufgaben</div>
        <div class="stat-value">${tasksOpen}</div>
        <div class="stat-trend text-soft">${state.tasks.filter(t => t.status==='in_progress').length} in Arbeit</div>
      </div>
    </div>

    <div class="grid grid-2 mb-4">
      <div class="card">
        <div class="card-h">
          <div class="card-title">Saisonverlauf</div>
          <div class="row gap-1">
            <button class="btn btn-sm btn-ghost" data-range="7">7T</button>
            <button class="btn btn-sm btn-ghost" data-range="30">30T</button>
            <button class="btn btn-sm btn-ghost" data-range="saison">Saison</button>
          </div>
        </div>
        <div class="card-body">
          <div class="progress mb-3" title="${seasonPct}% der Saison"><div class="progress-bar" style="width:${seasonPct}%"></div></div>
          <canvas id="dash-harvest" class="chart" style="height:200px"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-h">
          <div class="card-title">Anstehende Aufgaben</div>
          <button class="btn btn-sm" onclick="navigate('tasks')">Alle anzeigen</button>
        </div>
        <div class="card-body" id="dash-tasks"></div>
      </div>
    </div>

    <div class="grid grid-3">
      <div class="card">
        <div class="card-h">
          <div class="card-title">Mitglieder nach Anteil</div>
          <button class="btn btn-sm" onclick="navigate('members')">Verwalten</button>
        </div>
        <div class="card-body"><canvas id="dash-shares" class="chart" style="height:200px"></canvas></div>
      </div>
      <div class="card">
        <div class="card-h">
          <div class="card-title">Aktivität</div>
        </div>
        <div class="card-body">
          <div class="activity">
            ${activityFeed(6)}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-h">
          <div class="card-title">Heute auf dem Hof</div>
        </div>
        <div class="card-body" id="dash-today"></div>
      </div>
    </div>
  `;

  // Charts
  drawHarvestChart('dash-harvest', 90);
  drawShareChart('dash-shares');
  renderDashTasks();
  renderDashToday();

  // Range switcher
  $$('[data-range]', root).forEach(b => b.onclick = () => {
    $$('[data-range]', root).forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const r = b.dataset.range;
    drawHarvestChart('dash-harvest', r === '7' ? 7 : r === '30' ? 30 : 90);
  });
};

function renderDashTasks() {
  const wrap = $('#dash-tasks');
  if (!wrap) return;
  const items = state.tasks
    .filter(t => t.status !== 'done')
    .sort((a,b) => new Date(a.due||0) - new Date(b.due||0))
    .slice(0, 6);
  if (!items.length) { wrap.innerHTML = `<div class="empty-state text-sm">Keine offenen Aufgaben 🌱</div>`; return; }
  wrap.innerHTML = items.map(t => `
    <div class="activity-item">
      <div class="activity-icon">${taskIcon(t.category)}</div>
      <div class="activity-body">
        <div><b>${escapeHTML(t.title)}</b> <span class="text-soft">· ${escapeHTML(t.assignee||'—')}</span></div>
        <div class="activity-time">Fällig: ${fmtDate(t.due)} · ${statusLabel(t.status)}</div>
      </div>
    </div>
  `).join('');
}

function renderDashToday() {
  const wrap = $('#dash-today');
  if (!wrap) return;
  const week = isoWeek(TODAY);
  const harvest = state.harvest.filter(h => h.date && sameDay(h.date, TODAY));
  const harvests = state.harvest.filter(h => h.date && daysBetween(startOfWeek(TODAY), h.date) >= 0 && daysBetween(h.date, addDays(startOfWeek(TODAY),6)) >= 0);
  const tasks = state.tasks.filter(t => t.due && sameDay(t.due, TODAY));
  const events = state.events.filter(e => e.date && sameDay(e.date, TODAY));
  const orders = state.orders.filter(o => o.delivery && sameDay(o.delivery, TODAY));
  wrap.innerHTML = `
    <div class="col gap-2">
      <div class="row gap-2"><span class="badge badge-info">KW ${week.week}</span><span class="text-soft text-sm">${fmtDate(TODAY)}</span></div>
      <div class="text-sm"><b>${harvest.length}</b> Erträge heute · <b>${fmtNum(harvests.reduce((s,h)=>s+h.amount,0))} kg</b> diese Woche</div>
      <div class="text-sm"><b>${tasks.length}</b> Aufgaben fällig</div>
      <div class="text-sm"><b>${events.length}</b> Termine heute</div>
      <div class="text-sm"><b>${orders.length}</b> Zusatzlieferungen</div>
      <div class="divider"></div>
      <div class="text-xs text-muted">Nächste Verteilung: ${nextDistribution()}</div>
    </div>
  `;
}

function nextDistribution() {
  // Find next Friday after today
  const d = new Date(TODAY);
  while (d.getDay() !== 5) d.setDate(d.getDate() + 1);
  return fmtDate(d);
}

function activityFeed(limit=10) {
  const events = [];
  state.payments.filter(p => p.date).forEach(p => events.push({
    date: p.date, icon: p.kind === 'beitrag' ? '💶' : '🧾',
    text: `${p.kind==='beitrag' ? 'Beitrag' : 'Ausgabe'} ${p.name ? '· ' + escapeHTML(p.name) : ''} ${fmtMoney(p.amount)}`
  }));
  state.harvest.filter(h => h.date).forEach(h => events.push({
    date: h.date, icon: '🌾',
    text: `Ernte ${escapeHTML(h.crop || '')} · ${fmtNum(h.amount)} ${h.unit||'kg'}`
  }));
  state.tasks.filter(t => t.status === 'done' && t.doneAt).forEach(t => events.push({
    date: t.doneAt, icon: '✅', text: `Erledigt: ${escapeHTML(t.title)}`
  }));
  state.messages.filter(m => m.date).forEach(m => events.push({
    date: m.date, icon: '✉️', text: `Mitteilung: ${escapeHTML(m.title)}`
  }));
  return events
    .sort((a,b) => new Date(b.date) - new Date(a.date))
    .slice(0, limit)
    .map(e => `<div class="activity-item"><div class="activity-icon">${e.icon}</div><div class="activity-body"><div>${e.text}</div><div class="activity-time">${fmtDateTime(e.date)}</div></div></div>`)
    .join('') || '<div class="text-soft text-sm">Noch keine Aktivität</div>';
}

window.filterMembers = function() {
  const q = ($('#member-search')?.value || '').toLowerCase().trim();
  const status = $('#member-status')?.value || '';
  const depot = $('#member-depot')?.value || '';
  const share = $('#member-share')?.value || '';
  let list = state.members.slice();
  if (q) list = list.filter(m => (m.name+m.email+m.phone+m.city).toLowerCase().includes(q));
  if (status) list = list.filter(m => m.status === status);
  if (depot) list = list.filter(m => m.depot === depot);
  if (share) list = list.filter(m => {
    const s = state.shares.find(s => s.member === m.id);
    return s && s.type === share;
  });
  list.sort((a,b) => a.name.localeCompare(b.name, 'de'));
  $('#member-count').textContent = `${list.length} Mitglieder`;
  const listEl = $('#member-list');
  if (!list.length) {
    listEl.innerHTML = '<div class="empty-state"><div class="icon">👥</div><h3>Keine Mitglieder gefunden</h3><p>Lege ein neues Mitglied an oder ändere die Filter.</p></div>';
    return;
  }
  listEl.innerHTML = list.map(m => {
    const s = state.shares.find(s => s.member === m.id && s.active);
    const depot = state.depots.find(d => d.id === m.depot);
    const initials = (m.name||'?').split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
    const shareLabel = s ? { small:'Klein', medium:'Mittel', large:'Groß' }[s.type] : '—';
    const statusClass = { aktiv:'badge-primary', pausiert:'badge-warn', warteliste:'badge-info', ausgeschieden:'badge-neutral' }[m.status] || 'badge-neutral';
    return `<div class="member-row" onclick="openMemberDetail('${m.id}')">
      <div class="row gap-2"><span class="avatar-sm">${initials}</span><div><div class="member-name">${escapeHTML(m.name)}</div><div class="member-sub">${escapeHTML(m.email||'')}</div></div></div>
      <div class="text-sm">${escapeHTML(depot?.name || '—')}</div>
      <div class="text-sm">${escapeHTML(shareLabel)} ${s ? '('+s.type+')' : ''}</div>
      <div class="text-sm">${escapeHTML(m.phone||'')}</div>
      <div><span class="badge ${statusClass}">${m.status}</span></div>
      <div class="text-right text-sm text-muted">seit ${fmtDate(m.since)}</div>

  }).join('');
};

window.exportMembersCSV = function() {
  const rows = [['Name','Status','Email','Telefon','Adresse','PLZ/Ort','Depot','Anteil','Beitritt','Beitrag/Monat']];
  for (const m of state.members) {
    const s = state.shares.find(x => x.member === m.id && x.active);
    const d = state.depots.find(x => x.id === m.depot);
    rows.push([m.name, m.status, m.email||'', m.phone||'', m.address||'', m.city||'', d?.name||'', s?.type||'', m.since||'', s?.monthlyPrice||'']);
  }
  const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');
  download('mitglieder.csv', csv, 'text/csv');
};

function download(name, content, type='text/plain') {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

window.endShare = async function(id) {
  if (await confirmDialog({ message:'Anteil beenden?', okText:'Beenden' })) {
    const s = state.shares.find(x => x.id === id);
    s.active = false;
    s.end = new Date().toISOString();
    Store.save(state);
    toast('Anteil beendet');
    render();
  }
};

window.recalcAllShares = function() {
  state.shares.forEach(s => { if (s.active) s.monthlyPrice = state.meta.sharePrice[s.type]; });
  Store.save(state);
  toast('Beiträge neu berechnet', 'success');
  render();
};

function sharesDistribution(root) {
  const byDepot = {};
  state.depots.forEach(d => byDepot[d.id] = { name: d.name, address: d.address, count: 0, small: 0, medium: 0, large: 0 });
  state.shares.filter(s => s.active).forEach(s => {
    const m = state.members.find(x => x.id === s.member);
    if (!m) return;
    const d = m.depot || 'none';
    if (!byDepot[d]) byDepot[d] = { name: 'Ohne Depot', address: '', count: 0, small: 0, medium: 0, large: 0 };
    byDepot[d].count++;
    byDepot[d][s.type]++;
  });
  root.innerHTML = `
    <div class="card">
      <div class="card-h"><div class="card-title">Anteile je Depot</div></div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Depot</th><th>Adresse</th><th class="text-right">Klein</th><th class="text-right">Mittel</th><th class="text-right">Groß</th><th class="text-right">Gesamt</th></tr></thead>
          <tbody>
            ${Object.entries(byDepot).map(([id, d]) => `<tr>
              <td><b>${escapeHTML(d.name)}</b></td>
              <td class="text-sm text-soft">${escapeHTML(d.address||'')}</td>
              <td class="table-num">${d.small}</td>
              <td class="table-num">${d.medium}</td>
              <td class="table-num">${d.large}</td>
              <td class="table-num"><b>${d.count}</b></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function sharesPricing(root) {
  const months = seasonMonths();
  const small = state.meta.sharePrice.small, medium = state.meta.sharePrice.medium, large = state.meta.sharePrice.large;
  const revenue = months.length * (counts().small*small + counts().medium*medium + counts().large*large);
  root.innerHTML = `
    <div class="grid grid-2">
      <div class="card card-pad">
        <div class="card-title mb-3">Anteilspreise anpassen</div>
        <div class="form-row"><label>Klein (€/Monat)</label><input id="pp-small" type="number" step="1" value="${small}"/></div>
        <div class="form-row"><label>Mittel (€/Monat)</label><input id="pp-medium" type="number" step="1" value="${medium}"/></div>
        <div class="form-row"><label>Groß (€/Monat)</label><input id="pp-large" type="number" step="1" value="${large}"/></div>
        <button class="btn btn-primary" id="pp-save">Speichern</button>
      </div>
      <div class="card card-pad">
        <div class="card-title mb-3">Saisonprognose</div>
        <div class="text-sm text-soft">${months.length} Verteilungswochen in dieser Saison</div>
        <div class="text-sm mt-2">Erwartete Einnahmen bei aktueller Verteilung:</div>
        <div class="stat-value text-mono" style="font-size:24px">${fmtMoney(revenue)}</div>
        <div class="divider"></div>
        <div class="text-sm">Empfohlene Richtwerte für ${state.meta.farm.members_target} Mitglieder:</div>
        <div class="row gap-3 mt-2">
          <div>🎯 ${Math.round(state.meta.farm.members_target * 0.4)} Klein</div>
          <div>🎯 ${Math.round(state.meta.farm.members_target * 0.45)} Mittel</div>
          <div>🎯 ${Math.round(state.meta.farm.members_target * 0.15)} Groß</div>
        </div>
      </div>
    </div>
  `;
  $('#pp-save').onclick = () => {
    state.meta.sharePrice.small = Number($('#pp-small').value);
    state.meta.sharePrice.medium = Number($('#pp-medium').value);
    state.meta.sharePrice.large = Number($('#pp-large').value);
    Store.save(state);
    toast('Preise gespeichert', 'success');
    render();
  };
}

function counts() {
  const c = { small: 0, medium: 0, large: 0 };
  state.shares.filter(s => s.active).forEach(s => c[s.type]++);
  return c;
}

  const d = id ? state.depots.find(x => x.id === id) : null;

    <div class="form-row"><label>Name *</label><input id="d-name" value="${d?escapeHTML(d.name):''}"/></div>

        </select>

  m2.footer.querySelector('[data-cancel]').onclick = () => m2.close();
  m2.footer.querySelector('[data-save]').onclick = () => {
    const data = {
      name: $('#d-name', m2.body).value.trim(),
      address: $('#d-addr', m2.body).value,
      day: $('#d-day', m2.body).value,
      pickup: $('#d-pickup', m2.body).value,
      contact: $('#d-contact', m2.body).value,
      capacity: Number($('#d-cap', m2.body).value),
      lat: parseFloat($('#d-lat', m2.body).value) || null,
      lng: parseFloat($('#d-lng', m2.body).value) || null,
      notes: $('#d-notes', m2.body).value
    };

    Store.save(state);
    m2.close();
    toast('Depot gespeichert', 'success');
    render();
  };
};

window.deleteDepot = async function(id) {

};

function distRoutes(root) {
  const members = state.members.filter(m => m.status==='aktiv' && m.depot);
  const grouped = {};
  members.forEach(m => { grouped[m.depot] = (grouped[m.depot] || 0) + 1; });
  const totalKm = state.depots.length * 12;
  const totalCo2 = totalKm * 0.18;
  root.innerHTML = `
    <div class="grid grid-3 mb-3">
      <div class="stat"><div class="stat-label">Depots aktiv</div><div class="stat-value">${state.depots.length}</div></div>
      <div class="stat info"><div class="stat-label">Wöchentliche Kilometer</div><div class="stat-value">${fmtNum(totalKm)}</div><div class="text-sm text-soft">Hof → Depots</div></div>
      <div class="stat accent"><div class="stat-label">CO₂ pro Woche</div><div class="stat-value">${fmtNum(totalCo2)} kg</div><div class="text-sm text-soft">geschätzt</div></div>
    </div>
    <div class="card">
      <div class="card-h"><div class="card-title">Routenplan</div></div>
      <div class="card-body">
        <div class="text-sm text-soft mb-2">Optimierte Reihenfolge basierend auf geografischer Lage:</div>
        <div class="row wrap gap-2">
          <span class="badge badge-primary">🏡 Hof Wurzelreich</span>
          ${state.depots.map(d => {
            const c = grouped[d.id] || 0;
            return `<span class="badge badge-info" title="${c} Mitglieder">→ ${escapeHTML(d.name)} (${c})</span>`;
          }).join('')}
          <span class="badge badge-primary">🏡 Hof Wurzelreich</span>
        </div>
        <div class="divider"></div>
        <div class="text-sm"><b>Hinweis:</b> Die Routenoptimierung berücksichtigt aktuelle Mitgliederzahlen und Postleitzahlen.</div>
      </div>
    </div>
  `;
}

function distPickups(root) {
  const today = new Date(TODAY);
  const dates = [];
  for (let i = 0; i < 8; i++) {
    const d = new Date(today); d.setDate(d.getDate() + i * 7 - (today.getDay() + 2) % 7);
    dates.push(d);
  }
  root.innerHTML = `
    <div class="card">
      <div class="card-h"><div class="card-title">Nächste Abholtermine</div></div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Datum</th><th>KW</th><th>Status</th><th>Geplante Ernte</th><th>Aktion</th></tr></thead>
          <tbody>
            ${dates.map(d => {
              const kw = isoWeek(d).week;
              return `<tr>
                <td><b>${fmtDate(d)}</b> (${['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]})</td>
                <td>KW ${kw}</td>
                <td><span class="badge badge-info">geplant</span></td>
                <td class="text-sm">Gemischtes Gemüse, Salat, Kräuter</td>

            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

window.openPickupLog = function(dateStr) {
  const date = new Date(dateStr);
  const shares = state.shares.filter(s => s.active);
  const picked = state.pickups?.filter(p => p.date === dateStr) || [];
  const body = h(`
    <div class="text-sm text-soft mb-2">Abholung am ${fmtDate(date)}</div>
    <div class="text-sm mb-2">Abgehakt: <b>${picked.length}</b> / ${shares.length}</div>
    <div class="progress mb-3"><div class="progress-bar" style="width:${shares.length?picked.length/shares.length*100:0}%"></div></div>
    <div class="table-wrap" style="max-height: 50vh">
      <table class="table">
        <thead><tr><th></th><th>Mitglied</th><th>Depot</th><th>Anteil</th><th>Notiz</th></tr></thead>
        <tbody>
          ${shares.map(s => {
            const m = state.members.find(x => x.id === s.member);
            const d = state.depots.find(x => x.id === m?.depot);
            const isPicked = picked.find(p => p.share === s.id);
            return `<tr>
              <td><input type="checkbox" data-share="${s.id}" ${isPicked?'checked':''}/></td>
              <td>${m?escapeHTML(m.name):'—'}</td>
              <td>${d?escapeHTML(d.name):'—'}</td>
              <td>${s.type}</td>
              <td><input type="text" data-note="${s.id}" value="${isPicked?.note||''}" placeholder="z. B. Eier"/></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `);
  const m2 = openModal({ title: 'Abholung — Log', body, footer: `<button class="btn" data-cancel>Abbrechen</button><button class="btn btn-primary" data-save>Speichern</button>`, wide: true });
  m2.footer.querySelector('[data-cancel]').onclick = () => m2.close();
  m2.footer.querySelector('[data-save]').onclick = () => {
    state.pickups = state.pickups?.filter(p => p.date !== dateStr) || [];
    $$('input[type=checkbox]', m2.body).forEach(cb => {
      if (cb.checked) {
        const sid = cb.dataset.share;
        const note = $(`[data-note="${sid}"]`, m2.body).value;
        state.pickups.push({ id: uid('p'), date: dateStr, share: sid, note, pickedAt: new Date().toISOString() });
      }
    });
    Store.save(state);
    m2.close();
    toast('Abholung gespeichert', 'success');
  };
};

function fieldCanvas(root) {
  const year = state.meta.season;
  root.innerHTML = `
    <div class="grid" style="grid-template-columns: 220px 1fr; gap: 16px;">
      <div class="field-beds">
        <div class="text-sm text-soft mb-2">Legende ${year}</div>
        ${state.beds.map(b => {
          const p = state.plantings.find(p => p.bed === b.id && p.year === year);
          const crop = p ? state.crops.find(c => c.id === p.crop) : null;
          return `<div class="field-bed" data-bed="${b.id}">
            <div class="field-bed-color" style="background:${crop ? CROP_PALETTE[crop.name]||'#888' : 'var(--line-strong)'}"></div>
            <div class="grow">
              <div>${escapeHTML(b.name)}</div>
              <div class="text-xs text-soft">${crop ? escapeHTML(crop.name) : 'brach'} · ${b.area} m²</div>
            </div>
          </div>`;
        }).join('') || '<div class="text-soft text-sm">Noch keine Beete</div>'}
      </div>
      <div class="field-canvas" id="field-canvas"></div>
    </div>
  `;
  const canvas = $('#field-canvas', root);
  // Render beds as blocks laid out in a grid
  const bedW = 110, bedH = 60, padding = 10;
  canvas.style.minHeight = (Math.ceil(state.beds.length / 4) * (bedH + padding) + 20) + 'px';
  canvas.innerHTML = state.beds.map((b, i) => {
    const col = i % 4, row = Math.floor(i / 4);
    const left = padding + col * (bedW + padding);
    const top = padding + row * (bedH + padding);
    const p = state.plantings.find(p => p.bed === b.id && p.year === year);
    const crop = p ? state.crops.find(c => c.id === p.crop) : null;
    return `<div class="field-bed-block" style="left:${left}px;top:${top}px;width:${bedW}px;height:${bedH}px;background:${crop ? CROP_PALETTE[crop.name]||'#888' : 'var(--line-strong)'}" onclick="openBedForm('${b.id}')">
      <div><b>${escapeHTML(b.name)}</b></div>
      <div style="font-size:9px;opacity:.9">${crop?escapeHTML(crop.name):'brach'}</div>
    </div>`;
  }).join('');
}

function calGantt(root) {
  const year = state.meta.season;
  const yearStart = new Date(year, 0, 1);
  const yearEnd = new Date(year, 11, 31);
  const totalDays = (yearEnd - yearStart) / 86400000;
  const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const items = state.plantings.filter(p => p.year === year).map(p => {
    const c = state.crops.find(x => x.id === p.crop);
    const b = state.beds.find(x => x.id === p.bed);
    const start = p.sowDate ? new Date(p.sowDate) : new Date(year, 2, 1);
    const end = p.expectedHarvest ? new Date(p.expectedHarvest) : new Date(start.getTime() + (c?.days || 90) * 86400000);
    return { id: p.id, label: `${c?.name||'?'} · ${b?.name||'?'}`, start, end, color: CROP_PALETTE[c?.name] || '#4a7c3a' };
  });
  root.innerHTML = `
    <div class="card" style="overflow:auto">
      <div class="gantt-row" style="background:var(--bg-soft);font-size:11px;font-weight:600;color:var(--ink-soft)">
        <div class="gantt-label">Kultur / Beet</div>
        <div class="gantt-months" style="grid-template-columns:repeat(12,1fr)">
          ${months.map(m => `<div class="gantt-month">${m}</div>`).join('')}
        </div>
      </div>
      ${items.length ? items.map(it => {
        const leftPct = Math.max(0, (it.start - yearStart) / totalDays * 100);
        const rightPct = Math.min(100, (it.end - yearStart) / totalDays * 100);
        const widthPct = rightPct - leftPct;
        return `<div class="gantt-row">
          <div class="gantt-label">${escapeHTML(it.label)}</div>
          <div class="gantt-track" style="position:relative">
            <div class="gantt-grid" style="grid-template-columns:repeat(12,1fr)">${Array(12).fill(0).map(()=>'<div></div>').join('')}</div>
            <div class="gantt-bar" style="left:${leftPct}%;width:${widthPct}%;background:${it.color}" title="${fmtDate(it.start)} – ${fmtDate(it.end)}">
              ${fmtDate(it.start)} → ${fmtDate(it.end)}
            </div>
          </div>
        </div>`;
      }).join('') : '<div class="empty-state"><div class="icon">📅</div><h3>Keine Bepflanzungen</h3></div>'}
    </div>
  `;
}

function calList(root) {
  const items = state.plantings.map(p => {
    const c = state.crops.find(x => x.id === p.crop);
    const b = state.beds.find(x => x.id === p.bed);
    return { ...p, cropName: c?.name, bedName: b?.name, color: CROP_PALETTE[c?.name] };
  }).sort((a,b) => new Date(a.sowDate||0) - new Date(b.sowDate||0));
  root.innerHTML = `
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Kultur</th><th>Beet</th><th>Saat</th><th>Ernte ab</th><th>Ertrag erwartet</th><th>Jahr</th></tr></thead>
        <tbody>
          ${items.map(p => `<tr>
            <td><span class="badge" style="background:${p.color||'#888'};color:#fff">${escapeHTML(p.cropName||'?')}</span></td>
            <td>${escapeHTML(p.bedName||'?')}</td>
            <td>${fmtDate(p.sowDate)}</td>
            <td>${fmtDate(p.expectedHarvest)}</td>
            <td class="text-mono">${fmtNum(p.expectedYield)} kg</td>
            <td>${p.year}</td>
          </tr>`).join('') || '<tr><td colspan="6" class="table-empty">Keine Bepflanzungen</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function harvByCrop(root) {
  const totals = {};
  state.harvest.forEach(h => {
    const c = state.crops.find(x => x.id === h.crop);
    if (!c) return;
    totals[c.name] = (totals[c.name] || 0) + h.amount;
  });
  const sorted = Object.entries(totals).sort((a,b) => b[1] - a[1]);
  const max = Math.max(...sorted.map(s => s[1]), 1);
  root.innerHTML = `
    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="card card-pad">
        <div class="card-title mb-3">Erntemengen nach Kultur</div>
        ${sorted.length ? sorted.map(([name, amount]) => `<div class="row gap-2 mb-2">
          <div style="width:140px;font-size:12px">${escapeHTML(name)}</div>
          <div class="grow"><div class="progress"><div class="progress-bar" style="width:${amount/max*100}%;background:${CROP_PALETTE[name]||'var(--primary)'}"></div></div></div>
          <div class="text-mono text-sm" style="min-width:70px;text-align:right">${fmtNum(amount)} kg</div>
        </div>`).join('') : '<div class="text-soft">Keine Daten</div>'}
      </div>
      <div class="card card-pad">
        <div class="card-title mb-3">Verteilung</div>
        <canvas id="harv-pie" class="chart" style="height:300px"></canvas>
      </div>
    </div>
  `;
  if (sorted.length) drawDonut('harv-pie', sorted.slice(0, 8).map(([name, v]) => ({ label: name, value: v, color: CROP_PALETTE[name] || '#888' })));
}

function harvByWeek(root) {
  const start = SEASON_START;
  const weeks = [];
  for (let i = 0; i < 40; i++) weeks.push({ start: addDays(start, i*7), end: addDays(start, i*7+6), amount: 0 });
  state.harvest.forEach(h => {
    const idx = Math.floor(daysBetween(start, h.date) / 7);
    if (idx >= 0 && idx < weeks.length) weeks[idx].amount += h.amount;
  });
  const max = Math.max(...weeks.map(w => w.amount), 1);
  root.innerHTML = `
    <div class="card card-pad">
      <div class="card-title mb-3">Wöchentliche Erntemenge</div>
      <div class="row" style="align-items:flex-end;gap:2px;height:200px">
        ${weeks.map(w => `<div style="flex:1;background:${w.amount>0?'var(--primary)':'var(--line)'};height:${w.amount/max*100||2}%;min-height:2px" title="KW ${isoWeek(w.start).week}: ${fmtNum(w.amount)} kg"></div>`).join('')}
      </div>
      <div class="row gap-3 mt-2 text-xs text-soft">
        <span>KW ${isoWeek(start).week}</span>
        <div class="grow"></div>
        <span>KW ${isoWeek(addDays(start, 39*7)).week}</span>
      </div>
    </div>
  `;
}

function tasksKanban(root) {
  const cols = [
    { id: 'backlog', title: 'Backlog' },
    { id: 'todo', title: 'Geplant' },
    { id: 'in_progress', title: 'In Arbeit' },
    { id: 'done', title: 'Erledigt' },
  ];
  root.innerHTML = `<div class="kanban">${cols.map(c => {
    const items = state.tasks.filter(t => t.status === c.id);
    return `<div class="kanban-col" data-col="${c.id}">
      <div class="kanban-col-h">${c.title} <span class="count">${items.length}</span></div>
      ${items.map(t => `<div class="kanban-card" draggable="true" data-id="${t.id}">
        <div class="kanban-card-title">${escapeHTML(t.title)}</div>
        <div class="kanban-card-meta">
          <span>${taskIcon(t.category)}</span>
          <span>${escapeHTML(t.assignee||'—')}</span>
          <div class="grow"></div>
          <span>${t.due ? fmtDate(t.due) : '—'}</span>
        </div>
        ${t.priority === 'high' ? '<div class="kanban-card-tags"><span class="badge badge-danger">Hoch</span></div>' : t.priority === 'low' ? '<div class="kanban-card-tags"><span class="badge badge-neutral">Niedrig</span></div>' : ''}
      </div>`).join('')}
    </div>`;
  }).join('')}</div>`;
  // Drag & drop
  let dragId = null;
  $$('.kanban-card', root).forEach(card => {
    card.ondragstart = (e) => { dragId = card.dataset.id; e.dataTransfer.effectAllowed = 'move'; };
    card.ondblclick = () => openTaskForm(dragId || card.dataset.id);
  });
  $$('.kanban-col', root).forEach(col => {
    col.ondragover = (e) => { e.preventDefault(); col.style.background = 'var(--primary-soft)'; };
    col.ondragleave = () => { col.style.background = ''; };
    col.ondrop = (e) => {
      e.preventDefault();
      col.style.background = '';
      const id = dragId || e.dataTransfer.getData('text');
      if (!id) return;
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        t.status = col.dataset.col;
        if (t.status === 'done') t.doneAt = new Date().toISOString(); else t.doneAt = null;
        Store.save(state);
        render();
      }
    };
  });
}

function tasksList(root) {

function tasksCal(root) {
  const year = state.meta.season;
  const yearStart = new Date(year, 0, 1);
  const yearEnd = new Date(year, 11, 31);
  const totalDays = (yearEnd - yearStart) / 86400000;
  const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const items = state.tasks.filter(t => t.due).map(t => {
    const start = new Date(t.due);
    const end = addDays(start, 1);
    return { id: t.id, label: t.title, start, end, color: t.priority==='high'?'var(--danger)':t.status==='done'?'var(--ink-muted)':'var(--primary)' };
  });
  root.innerHTML = `
    <div class="card" style="overflow:auto">
      <div class="gantt-row" style="background:var(--bg-soft);font-size:11px;font-weight:600;color:var(--ink-soft)">
        <div class="gantt-label">Aufgabe</div>
        <div class="gantt-months" style="grid-template-columns:repeat(12,1fr)">${months.map(m => `<div class="gantt-month">${m}</div>`).join('')}</div>
      </div>
      ${items.length ? items.map(it => {
        const leftPct = Math.max(0, (it.start - yearStart) / totalDays * 100);
        return `<div class="gantt-row">
          <div class="gantt-label">${escapeHTML(it.label)}</div>
          <div class="gantt-track" style="position:relative">
            <div class="gantt-grid" style="grid-template-columns:repeat(12,1fr)">${Array(12).fill(0).map(()=>'<div></div>').join('')}</div>
            <div class="gantt-bar" style="left:${leftPct}%;width:1.5%;background:${it.color}" title="${fmtDate(it.start)}"></div>
          </div>
        </div>`;
      }).join('') : '<div class="empty-state"><div class="icon">📅</div><h3>Keine Aufgaben mit Datum</h3></div>'}
    </div>
  `;
}

window.openOrderForm = function() {
  const body = h(`
    <div class="form-grid">
      <div class="form-row"><label>Mitglied *</label>
        <select id="o-member">${state.members.map(m => `<option value="${m.id}">${escapeHTML(m.name)}</option>`).join('')}</select>
      </div>
      <div class="form-row"><label>Lieferung am</label><input id="o-delivery" type="date"/></div>
    </div>
    <div class="form-section">Produkte</div>
    <div id="o-items"></div>
    <button class="btn btn-sm" id="o-add">+ Produkt</button>
    <div class="form-section">Summe</div>
    <div class="text-lg text-mono" id="o-total">€ 0,00</div>
  `);
  function renderItems() {
    const wrap = $('#o-items', body);
    wrap.innerHTML = '';
    const items = state.__draftItems = state.__draftItems || [{ product: state.products[0]?.id, qty: 1 }];
    items.forEach((it, idx) => {
      const row = h(`<div class="row gap-2 mb-2">
        <select data-idx="${idx}" data-k="product" class="grow" style="flex:2">
          ${state.products.map(p => `<option value="${p.id}" ${p.id===it.product?'selected':''}>${escapeHTML(p.name)} — ${fmtMoney(p.price)}</option>`).join('')}
        </select>
        <input type="number" data-idx="${idx}" data-k="qty" min="1" step="1" value="${it.qty}" style="width:80px"/>
        <button class="btn btn-sm btn-danger" data-rm="${idx}">×</button>
      </div>`);
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('select, input').forEach(el => {
      el.oninput = () => {
        const idx = Number(el.dataset.idx), k = el.dataset.k;
        if (k === 'qty') state.__draftItems[idx].qty = Number(el.value) || 0;
        if (k === 'product') state.__draftItems[idx].product = el.value;
        recalc();
      };
    });
    wrap.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
      state.__draftItems.splice(Number(b.dataset.rm), 1);
      renderItems(); recalc();
    });
  }
  function recalc() {
    const total = (state.__draftItems||[]).reduce((s, it) => {
      const p = state.products.find(p => p.id === it.product);
      return s + (p?.price||0) * (it.qty||0);
    }, 0);
    $('#o-total', body).textContent = fmtMoney(total);
  }
  $('#o-add', body).onclick = () => { state.__draftItems.push({ product: state.products[0]?.id, qty: 1 }); renderItems(); recalc(); };
  renderItems(); recalc();
  const m2 = openModal({ title: 'Neue Bestellung', body, footer: `<button class="btn" data-cancel>Abbrechen</button><button class="btn btn-primary" data-save>Anlegen</button>`, wide: true });
  m2.footer.querySelector('[data-cancel]').onclick = () => { delete state.__draftItems; m2.close(); };
  m2.footer.querySelector('[data-save]').onclick = () => {
    const items = (state.__draftItems||[]).map(it => {
      const p = state.products.find(p => p.id === it.product);
      return { product: it.product, name: p?.name, qty: it.qty, price: p?.price||0, total: (p?.price||0)*it.qty };
    });
    const total = items.reduce((s,i)=>s+i.total, 0);
    state.orders.push({
      id: uid('o'),
      member: $('#o-member', m2.body).value,
      date: new Date().toISOString(),
      delivery: $('#o-delivery', m2.body).value || null,
      items, total,
      status: 'offen'
    });
    delete state.__draftItems;
    Store.save(state);
    m2.close();
    toast('Bestellung angelegt', 'success');
    render();
  };
};

function finOverview(root, year) {
  const income = state.payments.filter(p => p.kind === 'beitrag' && p.date && new Date(p.date).getFullYear() === year).reduce((s,p)=>s+p.amount, 0);
  const expenses = state.payments.filter(p => p.kind === 'ausgabe' && p.date && new Date(p.date).getFullYear() === year).reduce((s,p)=>s+p.amount, 0);
  const other = state.payments.filter(p => p.kind === 'sonstig' && p.date && new Date(p.date).getFullYear() === year).reduce((s,p)=>s+p.amount, 0);
  const balance = income - expenses + other;
  // Monthly
  const monthly = Array(12).fill(0).map((_,i) => ({ income: 0, expense: 0, label: monthName(new Date(year, i, 1)) }));
  state.payments.forEach(p => {
    const d = new Date(p.date);
    if (d.getFullYear() !== year) return;
    const m = d.getMonth();
    if (p.kind === 'beitrag') monthly[m].income += p.amount;
    else if (p.kind === 'ausgabe') monthly[m].expense += p.amount;
  });
  // Outstanding
  const expected = state.shares.filter(s => s.active).reduce((s, sh) => s + (sh.monthlyPrice || 0), 0);
  const received = state.payments.filter(p => p.kind === 'beitrag' && p.date && new Date(p.date).getFullYear() === year && new Date(p.date).getMonth() === new Date().getMonth()).reduce((s,p)=>s+p.amount, 0);
  root.innerHTML = `
    <div class="grid grid-4 mb-4">
      <div class="stat"><div class="stat-label">Einnahmen</div><div class="stat-value">${fmtMoney(income)}</div><div class="text-sm text-soft">Mitgliederbeiträge</div></div>
      <div class="stat danger"><div class="stat-label">Ausgaben</div><div class="stat-value">${fmtMoney(expenses)}</div><div class="text-sm text-soft">laufender Betrieb</div></div>
      <div class="stat ${balance>=0?'primary':'danger'}"><div class="stat-label">Saldo</div><div class="stat-value">${fmtMoney(balance)}</div><div class="text-sm text-soft">${balance>=0?'positiv':'negativ'}</div></div>
      <div class="stat warn"><div class="stat-label">Offene Beiträge (Monat)</div><div class="stat-value">${fmtMoney(expected - received)}</div><div class="text-sm text-soft">erwartet: ${fmtMoney(expected)}</div></div>
    </div>
    <div class="card mb-3">
      <div class="card-h"><div class="card-title">Monatliche Einnahmen & Ausgaben</div></div>
      <div class="card-body"><canvas id="fin-monthly" class="chart-lg"></canvas></div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-h"><div class="card-title">Ausgaben nach Kategorie</div></div>
        <div class="card-body"><canvas id="fin-expense" class="chart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-h"><div class="card-title">Beitragsstatus Mitglieder</div></div>
        <div class="card-body" id="fin-memstatus"></div>
      </div>
    </div>
  `;
  drawBarChart('fin-monthly', monthly, 'income', 'expense');
  // Expense categories
  const exp = {};
  state.payments.filter(p => p.kind === 'ausgabe' && new Date(p.date).getFullYear() === year).forEach(p => {
    exp[p.category||'Sonstige'] = (exp[p.category||'Sonstige'] || 0) + p.amount;
  });
  drawDonut('fin-expense', Object.entries(exp).map(([k,v]) => ({ label: k, value: v, color: pickColor(k) })));
  // Member status
  const expectedNow = state.shares.filter(s => s.active).reduce((s, sh) => s + (sh.monthlyPrice || 0), 0);
  const receivedNow = state.payments.filter(p => p.kind === 'beitrag' && p.date && sameMonth(p.date, TODAY)).reduce((s,p)=>s+p.amount, 0);
  const pct = expectedNow ? receivedNow / expectedNow * 100 : 0;
  $('#fin-memstatus', root).innerHTML = `
    <div class="text-sm text-soft">Monat ${monthName(TODAY)}</div>
    <div class="text-lg text-mono mt-1">${fmtMoney(receivedNow)} / ${fmtMoney(expectedNow)}</div>
    <div class="progress mt-2"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="text-sm text-soft mt-2">${pct.toFixed(0)}% eingegangen</div>
    <div class="divider"></div>
    <div class="row gap-2">
      <button class="btn btn-sm btn-primary" onclick="chargeAllMembers()">Alle abbuchen</button>
      <button class="btn btn-sm" onclick="exportFinanceCSV()">CSV</button>
    </div>
  `;
}
